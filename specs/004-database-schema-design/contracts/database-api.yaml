openapi: 3.0.3
info:
  title: Finance Agent Database API
  description: API contracts for database operations in the Finance Agent system
  version: 1.0.0
  contact:
    name: Finance Agent Development Team

servers:
  - url: http://localhost:3000/api/v1
    description: Development server

tags:
  - name: Authentication
    description: User authentication and token management
  - name: Users
    description: User profile and account management
  - name: Portfolio
    description: Portfolio item management
  - name: Chat
    description: Chat session and message management
  - name: Agents
    description: Agent registry and A2A messaging

paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Creates a new user account with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserDto'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticates user and returns access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginUserDto'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/profile:
    get:
      tags:
        - Users
      summary: Get user profile
      description: Retrieve current user's profile information
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /portfolio:
    get:
      tags:
        - Portfolio
      summary: Get user's portfolio items
      description: Retrieve all portfolio items for the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Number of items per page
        - name: assetType
          in: query
          schema:
            $ref: '#/components/schemas/AssetType'
          description: Filter by asset type
      responses:
        '200':
          description: Portfolio items retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPortfolioResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Portfolio
      summary: Add a new portfolio item
      description: Add a new investment item to the user's portfolio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePortfolioItemDto'
      responses:
        '201':
          description: Portfolio item added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /portfolio/{id}:
    get:
      tags:
        - Portfolio
      summary: Get portfolio item by ID
      description: Retrieve a specific portfolio item by its ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Portfolio item ID
      responses:
        '200':
          description: Portfolio item retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Portfolio
      summary: Update a portfolio item
      description: Update an existing portfolio item
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Portfolio item ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePortfolioItemDto'
      responses:
        '200':
          description: Portfolio item updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Portfolio
      summary: Delete a portfolio item
      description: Remove a portfolio item from the user's portfolio
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Portfolio item ID
      responses:
        '204':
          description: Portfolio item deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /chat/sessions:
    get:
      tags:
        - Chat
      summary: Get user's chat sessions
      description: Retrieve all chat sessions for the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Number of items per page
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, ARCHIVED, DELETED]
          description: Filter by session status
      responses:
        '200':
          description: Chat sessions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChatSessionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Chat
      summary: Create a new chat session
      description: Start a new chat session
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatSessionDto'
      responses:
        '201':
          description: Chat session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /chat/sessions/{id}/messages:
    get:
      tags:
        - Chat
      summary: Get messages in a chat session
      description: Retrieve all messages in a specific chat session
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Chat session ID
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Number of messages per page
      responses:
        '200':
          description: Messages retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMessagesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /agents/registry:
    get:
      tags:
        - Agents
      summary: Get registered agents
      description: Retrieve all registered agents in the system
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Registered agents retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentsRegistryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Agents
      summary: Register a new agent
      description: Register a new agent in the system
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAgentDto'
      responses:
        '201':
          description: Agent registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterUserDto:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
      properties:
        email:
          type: string
          format: email
          description: User's email address
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: User's password
          example: securePassword123
        firstName:
          type: string
          maxLength: 100
          description: User's first name
          example: John
        lastName:
          type: string
          maxLength: 100
          description: User's last name
          example: Doe

    LoginUserDto:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User's email address
          example: user@example.com
        password:
          type: string
          format: password
          description: User's password
          example: securePassword123

    LoginResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - user
      properties:
        accessToken:
          type: string
          description: JWT access token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          description: JWT refresh token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/UserResponse'

    UserResponse:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique user identifier
          example: 123e4567-e89b-12d3-a456-426614174000
        email:
          type: string
          format: email
          description: User's email address
          example: user@example.com
        firstName:
          type: string
          description: User's first name
          example: John
        lastName:
          type: string
          description: User's last name
          example: Doe
        isActive:
          type: boolean
          description: Account activation status
          example: true
        createdAt:
          type: string
          format: date-time
          description: Account creation timestamp
          example: '2023-01-01T00:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          description: Account last update timestamp
          example: '2023-01-01T00:00:00.000Z'

    UserProfile:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - isActive
      properties:
        id:
          type: string
          format: uuid
          description: Unique user identifier
          example: 123e4567-e89b-12d3-a456-426614174000
        email:
          type: string
          format: email
          description: User's email address
          example: user@example.com
        firstName:
          type: string
          description: User's first name
          example: John
        lastName:
          type: string
          description: User's last name
          example: Doe
        isActive:
          type: boolean
          description: Account activation status
          example: true

    AssetType:
      type: string
      enum:
        - STOCK
        - BOND
        - CRYPTO
        - ETF
        - FUND
        - CASH
        - OTHER

    CreatePortfolioItemDto:
      type: object
      required:
        - assetType
        - symbol
        - name
        - quantity
        - costBasis
        - currency
      properties:
        assetType:
          $ref: '#/components/schemas/AssetType'
        symbol:
          type: string
          maxLength: 20
          description: Asset symbol/ticker
          example: AAPL
        name:
          type: string
          maxLength: 255
          description: Full name of the asset
          example: Apple Inc.
        quantity:
          type: number
          format: decimal
          minimum: 0
          exclusiveMinimum: true
          description: Quantity of the asset
          example: 10.5
        costBasis:
          type: number
          format: decimal
          minimum: 0
          description: Average cost basis per unit
          example: 150.75
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Currency code (ISO 4217)
          example: USD
        purchaseDate:
          type: string
          format: date
          description: Date of purchase
          example: '2023-01-15'
        currentValue:
          type: number
          format: decimal
          minimum: 0
          description: Current total value of the asset
          example: 1650.25

    UpdatePortfolioItemDto:
      type: object
      properties:
        quantity:
          type: number
          format: decimal
          minimum: 0
          exclusiveMinimum: true
          description: Updated quantity of the asset
          example: 12.0
        costBasis:
          type: number
          format: decimal
          minimum: 0
          description: Updated cost basis per unit
          example: 145.50
        currentValue:
          type: number
          format: decimal
          minimum: 0
          description: Updated current value of the asset
          example: 1800.00

    PortfolioItemResponse:
      type: object
      required:
        - id
        - assetType
        - symbol
        - name
        - quantity
        - costBasis
        - currency
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique portfolio item identifier
          example: 123e4567-e89b-12d3-a456-426614174001
        assetType:
          $ref: '#/components/schemas/AssetType'
        symbol:
          type: string
          description: Asset symbol/ticker
          example: AAPL
        name:
          type: string
          description: Full name of the asset
          example: Apple Inc.
        quantity:
          type: number
          format: decimal
          description: Quantity of the asset
          example: 10.5
        costBasis:
          type: number
          format: decimal
          description: Average cost basis per unit
          example: 150.75
        currency:
          type: string
          description: Currency code (ISO 4217)
          example: USD
        purchaseDate:
          type: string
          format: date
          description: Date of purchase
          example: '2023-01-15'
        currentValue:
          type: number
          format: decimal
          description: Current total value of the asset
          example: 1650.25
        currentPrice:
          type: number
          format: decimal
          description: Current price per unit
          example: 157.17
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: '2023-01-01T00:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: '2023-01-01T00:00:00.000Z'

    PaginatedPortfolioResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioItemResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginationMeta:
      type: object
      required:
        - total
        - page
        - limit
        - totalPages
      properties:
        total:
          type: integer
          description: Total number of items
          example: 100
        page:
          type: integer
          description: Current page number
          example: 1
        limit:
          type: integer
          description: Number of items per page
          example: 20
        totalPages:
          type: integer
          description: Total number of pages
          example: 5

    CreateChatSessionDto:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          description: Title for the chat session
          example: "Investment Discussion"

    ChatSessionResponse:
      type: object
      required:
        - id
        - title
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique chat session identifier
          example: 123e4567-e89b-12d3-a456-426614174002
        title:
          type: string
          description: Title of the chat session
          example: Investment Discussion
        status:
          type: string
          enum: [ACTIVE, ARCHIVED, DELETED]
          description: Status of the chat session
          example: ACTIVE
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: '2023-01-01T00:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: '2023-01-01T00:00:00.000Z'

    PaginatedChatSessionsResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChatSessionResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    MessageSenderType:
      type: string
      enum:
        - USER
        - AGENT
        - SYSTEM

    MessageType:
      type: string
      enum:
        - TEXT
        - COMMAND
        - NOTIFICATION
        - DATA

    MessageResponse:
      type: object
      required:
        - id
        - senderType
        - content
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique message identifier
          example: 123e4567-e89b-12d3-a456-426614174003
        senderType:
          $ref: '#/components/schemas/MessageSenderType'
        senderId:
          type: string
          format: uuid
          description: ID of the sender (if applicable)
          example: 123e4567-e89b-12d3-a456-426614174000
        content:
          type: string
          description: Content of the message
          example: "Can you analyze my portfolio?"
        messageType:
          $ref: '#/components/schemas/MessageType'
        metadata:
          type: object
          description: Additional metadata
          example: {"sentiment": "neutral"}
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: '2023-01-01T00:00:00.000Z'

    PaginatedMessagesResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MessageResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    RegisterAgentDto:
      type: object
      required:
        - name
        - description
        - endpointUrl
      properties:
        name:
          type: string
          maxLength: 255
          description: Name of the agent
          example: "Analysis Agent"
        description:
          type: string
          description: Description of the agent's functionality
          example: "Provides financial analysis and insights"
        endpointUrl:
          type: string
          format: uri
          description: API endpoint URL of the agent
          example: "http://analysis-agent:3000/api"
        capabilities:
          type: array
          items:
            type: string
          description: List of agent capabilities
          example: ["analyze_portfolio", "market_research"]

    AgentResponse:
      type: object
      required:
        - id
        - name
        - description
        - endpointUrl
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique agent identifier
          example: 123e4567-e89b-12d3-a456-426614174004
        name:
          type: string
          description: Name of the agent
          example: "Analysis Agent"
        description:
          type: string
          description: Description of the agent's functionality
          example: "Provides financial analysis and insights"
        endpointUrl:
          type: string
          format: uri
          description: API endpoint URL of the agent
          example: "http://analysis-agent:3000/api"
        isActive:
          type: boolean
          description: Whether the agent is active
          example: true
        capabilities:
          type: array
          items:
            type: string
          description: List of agent capabilities
          example: ["analyze_portfolio", "market_research"]
        lastHeartbeat:
          type: string
          format: date-time
          description: Timestamp of last heartbeat
          example: '2023-01-01T00:00:00.000Z'
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: '2023-01-01T00:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: '2023-01-01T00:00:00.000Z'

    AgentsRegistryResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentResponse'

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Bad Request"
              message:
                type: string
                example: "Invalid input data"
              statusCode:
                type: number
                example: 400
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Unauthorized"
              message:
                type: string
                example: "Authentication token is missing or invalid"
              statusCode:
                type: number
                example: 401
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Not Found"
              message:
                type: string
                example: "Requested resource does not exist"
              statusCode:
                type: number
                example: 404
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Conflict"
              message:
                type: string
                example: "Resource already exists"
              statusCode:
                type: number
                example: 409